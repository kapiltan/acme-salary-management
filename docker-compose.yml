services:
  postgres:
    image: postgres:17
    container_name: acme-postgres
    environment:
      POSTGRES_DB: acme_salary
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme_password
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: acme-salary-backend:latest
    container_name: acme-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/acme_salary
      SPRING_DATASOURCE_USERNAME: acme
      SPRING_DATASOURCE_PASSWORD: acme_password
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Kolkata"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    image: acme-salary-frontend:latest
    container_name: acme-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
